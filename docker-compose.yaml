services:
  proposal-app:
    image: proposal-app
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      rabbit-mq:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  rabbit-mq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      timeout: 5s
      interval: 5s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: proposaldb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proposaldb"]
      timeout: 5s
      interval: 5s
      retries: 10
