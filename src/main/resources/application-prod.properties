spring.application.name=proposal-app

#Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/proposaldb
spring.datasource.password=12345
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#RabbitMQ Configuration
spring.rabbitmq.host=rabbit-mq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.pendingproposal.exchange=proposta-pendente.ex
rabbitmq.concludedproposal.exchange=proposta-concluida.ex
rabbitmq.queue.concluded.proposal=proposta-concluida.ms-proposta
